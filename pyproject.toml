[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-express-mcp"
version = "0.1.0"
description = "SF Express order and tracking MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sf-express-mcp = "sf_express_mcp.server:main"
sf-express-smoke = "sf_express_mcp.smoke_web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_express_mcp = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
